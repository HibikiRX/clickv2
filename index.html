<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envoie un message anonyme</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #ff6b35, #f7197c); color:#fff; display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; }
  h1 { font-size:1.8rem; text-align:center; margin:16px 0 4px; letter-spacing:-1px; }
  .sub { text-align:center; opacity:.9; margin:0 0 20px; }
  .card { background:#fff; color:#111; border-radius:24px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); margin-bottom:12px; }
  .head { background:rgba(0,0,0,.06); padding:14px 18px; font-weight:700; font-size:.95rem; }
  .head small { display:block; font-weight:400; opacity:.6; }
  textarea { width:100%; height:140px; border:0; outline:0; font:inherit; font-size:1.15rem; padding:18px; resize:none; color:#111; }
  .count { text-align:right; font-size:.75rem; opacity:.5; padding:0 14px 10px; color:#111; }
  button { width:100%; border:0; border-radius:999px; padding:16px; font:inherit; font-weight:800; font-size:1.1rem; background:#111; color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  .note { text-align:center; font-size:.8rem; opacity:.9; margin:10px 0 16px; min-height:1.2em; }
</style>
</head>
<body>
<main id="app">
  <h1>@crush.haberges</h1>
  <p class="sub">🔒 100 % anonyme</p>
  <div class="card">
    <div class="head">Dis-nous tout !<small>ton message sera publié en story</small></div>
    <textarea id="txt" maxlength="300" placeholder="écris ton message anonyme…"></textarea>
    <div class="count"><span id="n">0</span>/300</div>
  </div>
  <p class="note" id="msg">Pas d'insultes, de liens, de numéros ni de @mentions.</p>
  <button id="send">Envoyer !</button>
</main>
<script>
const $ = id => document.getElementById(id);
$('txt').addEventListener('input', () => { $('n').textContent = $('txt').value.length; });
$('send').onclick = async () => {
  const text = $('txt').value.trim();
  if (!text) return;
  $('send').disabled = true;
  try {
    const r = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('msg').textContent = j.error || 'Envoi impossible.'; $('send').disabled = false; return; }
    $('app').innerHTML = `<h1>Envoyé ! 🎉</h1><p class="sub">ton message est parti, anonymement.</p><button onclick="location.reload()">Envoyer un autre</button>`;
  } catch { $('msg').textContent = 'Erreur réseau.'; $('send').disabled = false; }
};
</script>
</body>
</html>
